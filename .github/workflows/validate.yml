name: Validate media kit

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: paul-fleury-mediakit
          path: dist/*
          if-no-files-found: error
          retention-days: 14
